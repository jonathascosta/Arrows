name: iOS

# Builds the iOS app for the simulator, without signing (docs/PLAN.md, T8): every
# push to main, and pull requests that touch the app, the engine or the lockfile.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/game/**'
      - 'packages/engine/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS build (simulator, unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app's build, without the puzzle picker (a tool for testing on the web only).
      - run: pnpm --filter @arrows/game build:ios
      - name: The app ships no puzzle picker
        run: test ! -e apps/game/dist/dev.html
      # Copies the web build into the Xcode project and writes its Swift package list.
      - run: pnpm --filter @arrows/game exec cap sync ios
      - run: xcodebuild -version
      - name: Build the app
        working-directory: apps/game/ios/App
        run: >-
          xcodebuild build
          -project App.xcodeproj
          -scheme App
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
