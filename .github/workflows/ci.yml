name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same gates as the pre-commit hook.
      - run: pnpm lint
      - run: pnpm format:check
      # The engine's drawings are what the PNG art makes (tools/png-to-drawing.ts).
      - run: pnpm drawings:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    # The acceptance flows of docs/PLAN.md, on a touch phone profile and a desktop
    # profile, against the production build.
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arrows/game exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Lighthouse's accessibility audit on every screen (docs/PRODUCT.md, Accessibility).
      - run: pnpm test:a11y
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/game/playwright-report
            apps/game/test-results
          if-no-files-found: ignore

  calibration:
    # Difficulty per tier and league promotion rates must stay inside the bands the
    # design sets; each suite generates thousands of puzzles or simulated days.
    name: Calibration suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:calibration
